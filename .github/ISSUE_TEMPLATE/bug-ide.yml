name: IDE bug
description: Something is broken in SensAI IDE
title: "[ide] "
labels: ["bug", "ide"]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: Steps, expected, actual. GitHub-flavored Markdown is supported. You can add screenshots after the issue opens.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: SensAI IDE Help → About
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: Windows 11, macOS 15, Ubuntu 24.04
    validations:
      required: true
